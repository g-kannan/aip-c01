<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="caching-title caching-desc">
  <title id="caching-title">Prompt caching reuses the input; semantic caching reuses the answer</title>
  <desc id="caching-desc">Two lanes. Prompt caching: the request carries a system prompt and tools; a cache checkpoint reads the matching prefix from the cache instead of reprocessing it; the model still runs on the new tokens and writes a fresh answer, which saves input cost and time to first token. Semantic caching: the question is embedded and searched against stored questions; above the similarity threshold the stored answer is returned with no model call; on a miss the model is called and the answer is stored. Choose prompt caching for a large stable prefix and answers that must be fresh or personalised. Choose semantic caching when many users ask the same thing in different words and one answer fits everyone. Combine them by putting the semantic cache in front and using prompt caching on the model call behind it.</desc>

  <style>
    .head { font-family: 'Archivo', Arial, sans-serif; font-weight: 800; }
    .sans { font-family: 'Nunito', Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
  </style>

  <!-- Background: light slide tone from the deck palette -->
  <rect x="0" y="0" width="1600" height="900" fill="#f4f2e9"/>

  <!-- Heading -->
  <text x="80" y="92" class="mono" font-size="24" fill="#b8330f">AMAZON BEDROCK · CACHING</text>
  <text x="80" y="160" class="head" font-size="56" fill="#17241f">One reuses the prompt, one reuses the answer</text>

  <!-- Lane 1: prompt caching -->
  <rect x="80" y="200" width="1440" height="220" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="112" y="238" class="mono" font-size="22" fill="#b8330f">PROMPT CACHE · THE MODEL STILL RUNS</text>

  <rect x="112" y="262" width="300" height="130" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="132" y="306" class="head" font-size="26" fill="#17241f">Request</text>
  <text x="132" y="340" class="sans" font-size="20" fill="#17241f">System prompt, tools,</text>
  <text x="132" y="366" class="sans" font-size="20" fill="#17241f">then the question.</text>

  <rect x="470" y="262" width="300" height="130" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="490" y="306" class="head" font-size="26" fill="#17241f">Cache checkpoint</text>
  <text x="490" y="340" class="sans" font-size="20" fill="#17241f">Matching prefix is read</text>
  <text x="490" y="366" class="sans" font-size="20" fill="#17241f">from the cache.</text>

  <rect x="828" y="262" width="300" height="130" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="848" y="306" class="head" font-size="26" fill="#17241f">Model runs</text>
  <text x="848" y="340" class="sans" font-size="20" fill="#17241f">Only the new tokens are</text>
  <text x="848" y="366" class="sans" font-size="20" fill="#17241f">processed fresh.</text>

  <rect x="1186" y="262" width="300" height="130" fill="#17241f" stroke="#17241f" stroke-width="2"/>
  <text x="1206" y="306" class="head" font-size="26" fill="#f4f2e9">Fresh answer</text>
  <text x="1206" y="340" class="sans" font-size="20" fill="#e6eae4">Saves input cost and</text>
  <text x="1206" y="366" class="sans" font-size="20" fill="#e6eae4">time to first token.</text>

  <g stroke="#e64b26" stroke-width="3" fill="#e64b26">
    <line x1="420" y1="327" x2="452" y2="327"/><polygon points="462,327 450,320 450,334" stroke="none"/>
    <line x1="778" y1="327" x2="810" y2="327"/><polygon points="820,327 808,320 808,334" stroke="none"/>
    <line x1="1136" y1="327" x2="1168" y2="327"/><polygon points="1178,327 1166,320 1166,334" stroke="none"/>
  </g>

  <!-- Lane 2: semantic caching -->
  <rect x="80" y="440" width="1440" height="220" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="112" y="478" class="mono" font-size="22" fill="#b8330f">SEMANTIC CACHE · THE MODEL MAY NOT RUN</text>

  <rect x="112" y="502" width="300" height="130" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="132" y="546" class="head" font-size="26" fill="#17241f">Request</text>
  <text x="132" y="580" class="sans" font-size="20" fill="#17241f">Embed the question</text>
  <text x="132" y="606" class="sans" font-size="20" fill="#17241f">into a vector.</text>

  <rect x="470" y="502" width="300" height="130" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="490" y="546" class="head" font-size="26" fill="#17241f">Vector search</text>
  <text x="490" y="580" class="sans" font-size="20" fill="#17241f">Nearest stored question;</text>
  <text x="490" y="606" class="sans" font-size="20" fill="#17241f">compare to the threshold.</text>

  <rect x="828" y="502" width="300" height="130" fill="#17241f" stroke="#17241f" stroke-width="2"/>
  <text x="848" y="546" class="head" font-size="26" fill="#f4f2e9">Hit: reuse</text>
  <text x="848" y="580" class="sans" font-size="20" fill="#e6eae4">Return the stored answer.</text>
  <text x="848" y="606" class="sans" font-size="20" fill="#e6eae4">No model call.</text>

  <rect x="1186" y="502" width="300" height="130" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="1206" y="546" class="head" font-size="26" fill="#17241f">Miss: call model</text>
  <text x="1206" y="580" class="sans" font-size="20" fill="#17241f">Call the model, then</text>
  <text x="1206" y="606" class="sans" font-size="20" fill="#17241f">store the answer.</text>

  <g stroke="#e64b26" stroke-width="3" fill="#e64b26">
    <line x1="420" y1="567" x2="452" y2="567"/><polygon points="462,567 450,560 450,574" stroke="none"/>
    <line x1="778" y1="567" x2="810" y2="567"/><polygon points="820,567 808,560 808,574" stroke="none"/>
  </g>
  <text x="1157" y="574" class="mono" font-size="22" fill="#b8330f" text-anchor="middle">or</text>

  <!-- Choose-when cards -->
  <rect x="80" y="690" width="700" height="170" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="112" y="732" class="head" font-size="26" fill="#17241f">Choose prompt caching when</text>
  <text x="112" y="768" class="sans" font-size="20" fill="#17241f">Large stable prefix: system prompt, tools, long documents.</text>
  <text x="112" y="798" class="sans" font-size="20" fill="#17241f">Answers must be fresh or personalised.</text>
  <text x="112" y="828" class="sans" font-size="20" fill="#17241f">Correctness matters more than the saved call.</text>

  <rect x="820" y="690" width="700" height="170" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="852" y="732" class="head" font-size="26" fill="#17241f">Choose semantic caching when</text>
  <text x="852" y="768" class="sans" font-size="20" fill="#17241f">Many users ask the same thing in different words.</text>
  <text x="852" y="798" class="sans" font-size="20" fill="#17241f">One answer fits everyone and can be slightly stale.</text>
  <text x="852" y="828" class="sans" font-size="20" fill="#b8330f">Avoid it for personalised or fast-changing answers.</text>

  <text x="80" y="886" class="sans" font-size="20" fill="#526057">Combine them: semantic cache in front; on a miss, call the model with prompt caching on its stable prefix.</text>
</svg>
