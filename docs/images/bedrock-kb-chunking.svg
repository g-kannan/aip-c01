<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="chunking-title chunking-desc">
  <title id="chunking-title">Five ways Amazon Bedrock Knowledge Bases split a document into chunks</title>
  <desc id="chunking-desc">Ingestion splits each document into chunks, embeds them, and stores them in a vector index that maps back to the source. Five strategies: default (about 300 tokens, sentences kept whole, no settings); fixed-size (max tokens per chunk and overlap percentage); hierarchical (parent max tokens, child max tokens, overlap tokens; retrieves the parent of a matching child; two levels only); semantic (max tokens, buffer size, breakpoint percentile threshold; uses a foundation model, extra cost); no chunking (whole document as one chunk; pre-split files first, and no page numbers in citations).</desc>

  <style>
    .head { font-family: 'Archivo', Arial, sans-serif; font-weight: 800; }
    .sans { font-family: 'Nunito', Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
  </style>

  <!-- Background: light slide tone from the deck palette -->
  <rect x="0" y="0" width="1600" height="900" fill="#f4f2e9"/>

  <!-- Heading -->
  <text x="80" y="92" class="mono" font-size="24" fill="#b8330f">AMAZON BEDROCK · KNOWLEDGE BASE · CHUNKING</text>
  <text x="80" y="160" class="head" font-size="56" fill="#17241f">Five ways to split a document into chunks</text>

  <!-- Left column: ingestion pipeline -->
  <rect x="80" y="200" width="320" height="360" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="112" y="244" class="mono" font-size="22" fill="#b8330f">INGESTION</text>

  <rect x="112" y="272" width="256" height="64" fill="#17241f"/>
  <text x="132" y="312" class="mono" font-size="20" fill="#f4f2e9">1  Split into chunks</text>

  <rect x="112" y="352" width="256" height="64" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="132" y="392" class="mono" font-size="20" fill="#17241f">2  Embed each chunk</text>

  <rect x="112" y="432" width="256" height="64" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="132" y="472" class="mono" font-size="20" fill="#17241f">3  Store in index</text>

  <text x="112" y="524" class="sans" font-size="20" fill="#17241f">Each vector maps back to</text>
  <text x="112" y="550" class="sans" font-size="20" fill="#17241f">its source document.</text>

  <!-- Left side note: table and figure context -->
  <rect x="80" y="590" width="320" height="260" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="112" y="632" class="head" font-size="26" fill="#17241f">Tables and figures</text>
  <text x="112" y="672" class="sans" font-size="20" fill="#17241f">Markdown content can return</text>
  <text x="112" y="698" class="sans" font-size="20" fill="#17241f">the full page or table as</text>
  <text x="112" y="724" class="sans" font-size="20" fill="#17241f">context if it is 10,000</text>
  <text x="112" y="750" class="sans" font-size="20" fill="#17241f">characters or fewer.</text>
  <text x="112" y="796" class="sans" font-size="20" fill="#526057">Not used with no chunking.</text>
  <text x="112" y="822" class="sans" font-size="20" fill="#526057">Text strategies only.</text>

  <!-- Five strategy cards -->
  <!-- 1. Default -->
  <rect x="440" y="200" width="1080" height="122" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="472" y="244" class="head" font-size="30" fill="#17241f">Default</text>
  <text x="472" y="276" class="sans" font-size="22" fill="#17241f">About 300 tokens per chunk; sentences kept whole.</text>
  <text x="472" y="306" class="mono" font-size="19" fill="#b8330f">No settings to tune.</text>

  <!-- 2. Fixed-size -->
  <rect x="440" y="332" width="1080" height="122" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="472" y="376" class="head" font-size="30" fill="#17241f">Fixed-size</text>
  <text x="472" y="408" class="sans" font-size="22" fill="#17241f">Cut by a set token count; overlap between neighbors.</text>
  <text x="472" y="438" class="mono" font-size="19" fill="#b8330f">max tokens · overlap %</text>

  <!-- 3. Hierarchical -->
  <rect x="440" y="464" width="1080" height="122" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="472" y="508" class="head" font-size="30" fill="#17241f">Hierarchical</text>
  <text x="472" y="540" class="sans" font-size="22" fill="#17241f">Search small child chunks, return their larger parent. Two levels only.</text>
  <text x="472" y="570" class="mono" font-size="19" fill="#b8330f">parent max tokens · child max tokens · overlap tokens</text>

  <!-- 4. Semantic -->
  <rect x="440" y="596" width="1080" height="122" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="472" y="640" class="head" font-size="30" fill="#17241f">Semantic</text>
  <text x="472" y="672" class="sans" font-size="22" fill="#17241f">Break where meaning shifts, using a foundation model (extra cost).</text>
  <text x="472" y="702" class="mono" font-size="19" fill="#b8330f">max tokens · buffer size · breakpoint percentile threshold</text>

  <!-- 5. No chunking (dark accent card) -->
  <rect x="440" y="728" width="1080" height="122" fill="#17241f" stroke="#17241f" stroke-width="2"/>
  <text x="472" y="772" class="head" font-size="30" fill="#f4f2e9">No chunking</text>
  <text x="472" y="804" class="sans" font-size="22" fill="#e6eae4">Whole document is one chunk. Pre-split files first.</text>
  <text x="472" y="834" class="mono" font-size="19" fill="#f2906f">no settings · no page numbers in citations</text>
</svg>
