<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="knn-hnsw-title knn-hnsw-desc">
  <title id="knn-hnsw-title">KNN versus HNSW for nearest-neighbor vector search</title>
  <desc id="knn-hnsw-desc">KNN compares the query with every vector, so it is exact but slows as data grows and needs no index build. HNSW walks a layered graph, following a few links and skipping most vectors, so it is approximate, tunable with efSearch, grows slowly as data grows, and needs a graph built on top of the vectors. The table compares search method, accuracy, query speed, index build, memory, and best use.</desc>

  <defs>
    <marker id="cmp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e64b26"/>
    </marker>
  </defs>

  <style>
    .head { font-family: 'Archivo', Arial, sans-serif; font-weight: 800; }
    .sans { font-family: 'Nunito', Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
  </style>

  <!-- Background: light slide tone from the deck palette -->
  <rect x="0" y="0" width="1600" height="900" fill="#f4f2e9"/>

  <!-- Heading -->
  <text x="80" y="92" class="mono" font-size="24" fill="#b8330f">VECTOR SEARCH · NEAREST NEIGHBORS</text>
  <text x="80" y="160" class="head" font-size="56" fill="#17241f">KNN vs HNSW: exact scan or graph hops</text>

  <!-- Card 1: KNN -->
  <rect x="80" y="200" width="700" height="260" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="104" y="234" class="mono" font-size="20" fill="#b8330f">EXACT · BRUTE FORCE</text>
  <text x="104" y="278" class="head" font-size="40" fill="#17241f">KNN</text>
  <!-- Every query-to-vector comparison -->
  <g stroke="#9aa39c" stroke-width="1.5" fill="none">
    <line x1="130" y1="380" x2="190" y2="330"/>
    <line x1="130" y1="380" x2="260" y2="420"/>
    <line x1="130" y1="380" x2="300" y2="340"/>
    <line x1="130" y1="380" x2="370" y2="400"/>
    <line x1="130" y1="380" x2="420" y2="320"/>
    <line x1="130" y1="380" x2="470" y2="410"/>
    <line x1="130" y1="380" x2="520" y2="350"/>
    <line x1="130" y1="380" x2="580" y2="420"/>
    <line x1="130" y1="380" x2="610" y2="330"/>
    <line x1="130" y1="380" x2="680" y2="390"/>
    <line x1="130" y1="380" x2="240" y2="370"/>
    <line x1="130" y1="380" x2="360" y2="350"/>
    <line x1="130" y1="380" x2="540" y2="390"/>
    <line x1="130" y1="380" x2="660" y2="350"/>
  </g>
  <g fill="#17241f">
    <circle cx="190" cy="330" r="6"/>
    <circle cx="260" cy="420" r="6"/>
    <circle cx="300" cy="340" r="6"/>
    <circle cx="370" cy="400" r="6"/>
    <circle cx="420" cy="320" r="6"/>
    <circle cx="470" cy="410" r="6"/>
    <circle cx="520" cy="350" r="6"/>
    <circle cx="580" cy="420" r="6"/>
    <circle cx="610" cy="330" r="6"/>
    <circle cx="680" cy="390" r="6"/>
    <circle cx="240" cy="370" r="6"/>
    <circle cx="360" cy="350" r="6"/>
    <circle cx="540" cy="390" r="6"/>
    <circle cx="660" cy="350" r="6"/>
  </g>
  <circle cx="130" cy="380" r="9" fill="#e64b26"/>
  <text x="104" y="448" class="sans" font-size="20" fill="#526057">Compares the query with every vector.</text>

  <!-- Card 2: HNSW -->
  <rect x="820" y="200" width="700" height="260" fill="#f9f8f1" stroke="#c8cec3" stroke-width="2"/>
  <text x="844" y="234" class="mono" font-size="20" fill="#b8330f">APPROXIMATE · GRAPH</text>
  <text x="844" y="278" class="head" font-size="40" fill="#17241f">HNSW</text>
  <!-- Faint graph links between neighbors -->
  <g stroke="#c8cec3" stroke-width="2" fill="none">
    <line x1="930" y1="330" x2="980" y2="370"/>
    <line x1="980" y1="370" x2="1100" y2="350"/>
    <line x1="1040" y1="340" x2="1100" y2="350"/>
    <line x1="1100" y1="350" x2="1160" y2="320"/>
    <line x1="1160" y1="320" x2="1260" y2="350"/>
    <line x1="1260" y1="350" x2="1350" y2="330"/>
    <line x1="1000" y1="420" x2="1110" y2="400"/>
    <line x1="1110" y1="400" x2="1210" y2="410"/>
    <line x1="1210" y1="410" x2="1320" y2="420"/>
    <line x1="1280" y1="390" x2="1420" y2="390"/>
  </g>
  <!-- Path actually followed: a few hops toward the query's neighborhood -->
  <g stroke="#e64b26" stroke-width="4" fill="none" marker-end="url(#cmp-arrow)">
    <line x1="870" y1="380" x2="965" y2="372"/>
    <line x1="995" y1="370" x2="1085" y2="352"/>
    <line x1="1115" y1="350" x2="1145" y2="324"/>
  </g>
  <g fill="#17241f">
    <circle cx="930" cy="330" r="6"/>
    <circle cx="1000" cy="420" r="6"/>
    <circle cx="1040" cy="340" r="6"/>
    <circle cx="1110" cy="400" r="6"/>
    <circle cx="1210" cy="410" r="6"/>
    <circle cx="1320" cy="420" r="6"/>
    <circle cx="1350" cy="330" r="6"/>
    <circle cx="1420" cy="390" r="6"/>
    <circle cx="1260" cy="350" r="6"/>
    <circle cx="1280" cy="390" r="6"/>
    <circle cx="1160" cy="320" r="6"/>
    <circle cx="1100" cy="350" r="6"/>
    <circle cx="980" cy="370" r="6"/>
  </g>
  <circle cx="870" cy="380" r="9" fill="#e64b26"/>
  <circle cx="1160" cy="320" r="11" fill="none" stroke="#e64b26" stroke-width="3"/>
  <text x="844" y="448" class="sans" font-size="20" fill="#526057">Follows a few links; skips most vectors.</text>

  <!-- Comparison table -->
  <rect x="80" y="500" width="1440" height="40" fill="#17241f"/>
  <text x="104" y="527" class="mono" font-size="20" fill="#f4f2e9">ASPECT</text>
  <text x="404" y="527" class="mono" font-size="20" fill="#f2906f">KNN (exact)</text>
  <text x="974" y="527" class="mono" font-size="20" fill="#f2906f">HNSW (approximate)</text>

  <!-- Row 1: search -->
  <text x="104" y="571" class="head" font-size="22" fill="#17241f">Search</text>
  <text x="404" y="571" class="sans" font-size="22" fill="#17241f">Checks every vector</text>
  <text x="974" y="571" class="sans" font-size="22" fill="#17241f">Walks a layered graph</text>
  <line x1="80" y1="590" x2="1520" y2="590" stroke="#c8cec3" stroke-width="2"/>

  <!-- Row 2: accuracy -->
  <text x="104" y="621" class="head" font-size="22" fill="#17241f">Accuracy</text>
  <text x="404" y="621" class="sans" font-size="22" fill="#17241f">Exact: always the true nearest</text>
  <text x="974" y="621" class="sans" font-size="22" fill="#17241f">Approximate; tuned with efSearch</text>
  <line x1="80" y1="640" x2="1520" y2="640" stroke="#c8cec3" stroke-width="2"/>

  <!-- Row 3: query speed -->
  <text x="104" y="671" class="head" font-size="22" fill="#17241f">Query speed</text>
  <text x="404" y="671" class="sans" font-size="22" fill="#17241f">Slows in step with data size</text>
  <text x="974" y="671" class="sans" font-size="22" fill="#17241f">Grows slowly as data grows</text>
  <line x1="80" y1="690" x2="1520" y2="690" stroke="#c8cec3" stroke-width="2"/>

  <!-- Row 4: index build -->
  <text x="104" y="721" class="head" font-size="22" fill="#17241f">Index build</text>
  <text x="404" y="721" class="sans" font-size="22" fill="#17241f">None; just store the vectors</text>
  <text x="974" y="721" class="sans" font-size="22" fill="#17241f">Builds a graph; slower to build</text>
  <line x1="80" y1="740" x2="1520" y2="740" stroke="#c8cec3" stroke-width="2"/>

  <!-- Row 5: memory -->
  <text x="104" y="771" class="head" font-size="22" fill="#17241f">Memory</text>
  <text x="404" y="771" class="sans" font-size="22" fill="#17241f">Just the vectors</text>
  <text x="974" y="771" class="sans" font-size="22" fill="#17241f">Vectors plus links (set by M)</text>
  <line x1="80" y1="790" x2="1520" y2="790" stroke="#c8cec3" stroke-width="2"/>

  <!-- Row 6: best for -->
  <text x="104" y="821" class="head" font-size="22" fill="#17241f">Best for</text>
  <text x="404" y="821" class="sans" font-size="22" fill="#17241f">Small sets, or ground truth to test recall</text>
  <text x="974" y="821" class="sans" font-size="22" fill="#17241f">Large sets with latency targets</text>
  <line x1="80" y1="840" x2="1520" y2="840" stroke="#c8cec3" stroke-width="2"/>

  <!-- Footer -->
  <text x="80" y="872" class="sans" font-size="20" fill="#526057">Recall: the share of true nearest neighbors returned. Source: Malkov &amp; Yashunin, 2016 (HNSW).</text>
</svg>
