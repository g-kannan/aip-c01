site_name: AIP-C01 study site
# Set by the Pages workflow; empty for local builds so `mkdocs serve` stays at the root.
site_url: !ENV [SITE_URL, ""]
site_description: Notes, diagrams, slide decks and labs for the AWS Certified Generative AI Developer – Professional exam.
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  font:
    text: Nunito
    code: IBM Plex Mono
  palette:
    # Dark is the default whatever the OS prefers; the header toggle switches to light and remembers the choice.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

# Broken links and missing heading anchors fail `mkdocs build --strict`.
validation:
  links:
    anchors: warn

plugins:
  - search:
      lang: en
  - glightbox:
      zoomable: true
      draggable: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

# Pulls slides/, README.md and (optionally) the study guide in from outside docs/.
hooks:
  - hooks/mkdocs_hooks.py

nav:
  - Home: index.md
  - Exam map: exam-domains.md
  - Amazon Bedrock:
      - bedrock/index.md
      - Inference APIs: bedrock/inference.md
      - Knowledge Bases: bedrock/knowledge-bases.md
      - Chunking configuration: bedrock/chunking-configuration.md
      - Guardrails: bedrock/guardrails.md
      - Prompt management: bedrock/prompt-management.md
      - Monitoring and logging: bedrock/monitoring-and-logging.md
      - Caching: bedrock/caching.md
      - Cost and quota: bedrock/cost-and-quota.md
  - Other AWS services:
      - services/index.md
      - AWS Step Functions: services/step-functions.md
  - Visual references:
      - Diagrams: diagrams.md
      - Gotchas: gotchas.md
  # The hook expands this into the overview plus one generated page per deck.
  - Slide decks: decks/index.md
  - Labs and setup: labs.md
